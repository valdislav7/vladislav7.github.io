<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой первый сайт</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px;
        }

        h1 {
            font-size: 48px;
            color: #38bdf8;
        }

        p {
            font-size: 20px;
            opacity: 0.8;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            background-color: #38bdf8;
            color: black;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>

<body>

<header>
    <h1>Привет 👋</h1>
    <p>Я учусь делать сайты на MacBook</p>
    <button onclick="showMessage()">Нажми меня</button>
</header>

<script>
function showMessage() {
    alert("Ты уже на уровне выше новичка 😎");
}
</script>

</body>
</html>
